name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=macdev --cov-report=term-missing

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: mypy
        run: mypy

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e .

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: swift-format
        run: swift format lint --strict --recursive --parallel macos/Package.swift macos/Sources macos/Tests

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Swift build (warnings as errors)
        run: swift build --package-path macos --build-tests -Xswiftc -warnings-as-errors

      - name: SwiftLint analyzer
        run: |
          swift build --package-path macos --build-tests --scratch-path macos/.build/analyze -v > swift-build.log 2>&1
          swiftlint analyze --strict --compiler-log-path swift-build.log --reporter github-actions-logging

      - name: Test native bridge and build app
        run: |
          swift test --package-path macos
          python scripts/build_macos_app.py
