# SwiftLint covers semantic and static-analysis rules; layout and whitespace
# belong to swift-format (.swift-format), so overlapping style rules are disabled.
included:
  - macos/Package.swift
  - macos/Sources
  - macos/Tests
excluded:
  - macos/.build

disabled_rules:
  # Owned by swift-format.
  - line_length
  - trailing_comma
  - opening_brace
  - closure_parameter_position
  - vertical_parameter_alignment
  - statement_position
  - colon
  - comma
  - indentation_width
  # SwiftUI view builders and test fixtures are naturally long.
  - type_body_length
  - file_length
  - function_body_length
  - multiple_closures_with_trailing_closure
  - todo

opt_in_rules:
  - array_init
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - nslocalizedstring_key
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_self
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - test_case_accessibility
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

# `swiftlint analyze` rules need a compiler log; see scripts/lint.sh.
analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

identifier_name:
  excluded: [id, ok, to, x, y]

cyclomatic_complexity:
  ignores_case_statements: true

nesting:
  type_level: 2

# Backend bridge calls mirror the CLI's site fields one-to-one.
function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 4
